[package]
name = "git_diff_checker"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
git2 = "0.19"

[profile.release]
lto = true

[lints.clippy]
# Disallow the shortcuts
unwrap_used = "deny"
expect_used = "deny"
# Disallow the question mark operator
question_mark = "deny"
# Disallow common combinators that bypass matching
map_flatten = "deny"
# Optional: force explicit matches over simple 'if let' for results
single_match = "deny"
